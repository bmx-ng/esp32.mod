# Sources:
# https://docs.waveshare.com/ESP32-H2-DEV-KIT-N4
# https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32h2/esp32-h2-devkitm-1/user_guide.html
# https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32h2/schematic-checklist.html
# Chip and flash verified on a connected Waveshare ESP32-H2-DEV-KIT-N4.
format=1

[board]
name=Waveshare ESP32-H2-DEV-KIT-N4
vendor=Waveshare
kind=board
aliases=waveshare-esp32-h2-dev-kit-n4,h2-dev-kit-n4
target=esp32h2
module=ESP32-H2-MINI-1
documentation=https://docs.waveshare.com/ESP32-H2-DEV-KIT-N4

[build]
flash_size=4MiB
psram_size=none
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[bus.uart.default]
controller=0
tx=TX
rx=RX
baud=115200

[resource.rgb_led]
type=ws2812
pin=RGB_LED
count=1
order=grb

[resource.boot_button]
type=button
pin=BOOT
active=low

[resource.usb_uart_bridge]
type=usb_uart_bridge
bus=bus.uart.default

[constraint.strapping]
pins=RGB_LED,BOOT,IO25
status=caution
reason=GPIO8, GPIO9 and GPIO25 are sampled as strapping pins during reset

[constraint.native_usb]
pins=USB_DM,USB_DP
status=occupied
reason=Used by the native USB Serial/JTAG interface

[constraint.uart_bridge]
pins=TX,RX
status=shared
reason=GPIO24 and GPIO23 are connected to the onboard CH343 USB-to-UART bridge

[constraint.jtag]
pins=IO2,IO3,IO4,IO5
status=caution
reason=Shared with the optional external JTAG interface

[constraint.xtal_32k]
pins=IO13,IO14
status=caution
reason=These pins share the optional 32.768 kHz crystal function; check the fitted board before reassigning them

[constraint.wifi]
status=unavailable
reason=ESP32-H2 has Bluetooth LE and IEEE 802.15.4 radios but no Wi-Fi radio
