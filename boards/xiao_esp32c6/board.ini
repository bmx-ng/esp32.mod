# Sources:
# https://wiki.seeedstudio.com/xiao_esp32c6_getting_started/
# https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c6/schematic-checklist.html
# Chip and flash verified on a connected XIAO ESP32-C6.
format=1

[board]
name=Seeed Studio XIAO ESP32-C6
vendor=Seeed Studio
kind=board
aliases=xiao-esp32c6,xiao-c6
target=esp32c6
module=ESP32-C6FH4
documentation=https://wiki.seeedstudio.com/xiao_esp32c6_getting_started/

[build]
flash_size=4MiB
psram_size=none
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[bus.i2c.default]
controller=0
sda=SDA
scl=SCL
frequency=400000

[bus.spi.default]
controller=0
miso=MISO
mosi=MOSI
clock=SCK

[bus.uart.default]
controller=0
tx=TX
rx=RX
baud=115200

[resource.user_led]
type=led
pin=USER_LED
active=low

[resource.boot_button]
type=button
pin=BOOT
active=low

[resource.external_antenna_select]
type=rf_switch
pin=RF_ANT_SELECT
active=high

[resource.antenna_switch_enable]
type=rf_switch_enable
pin=RF_SWITCH_ENABLE
active=low

[constraint.strapping]
pins=MTMS,MTDI,BOOT,USER_LED
status=caution
reason=GPIO4, GPIO5, GPIO8, GPIO9 and GPIO15 are sampled as strapping pins during reset; GPIO8 is not exposed in the documented XIAO pin map

[constraint.native_usb]
pins=USB_DM,USB_DP
status=occupied
reason=Used by the native USB Serial/JTAG connection

[constraint.antenna_switch]
pins=RF_SWITCH_ENABLE,RF_ANT_SELECT
status=occupied
reason=GPIO3 low enables RF switch control; GPIO14 low selects the ceramic antenna and high selects the external antenna

[constraint.jtag]
pins=MTMS,MTDI,MTCK,MTDO
status=caution
reason=Shared with the external JTAG interface
