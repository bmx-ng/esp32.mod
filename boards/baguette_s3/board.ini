# Sources:
# https://thepihut.com/products/baguette-s3-esp32-s3-prototyping-board
# https://thepihut.com/blogs/raspberry-pi-tutorials/baguette-s3-user-guide
format=1

[board]
name=Baguette S3
vendor=The Pi Hut
kind=board
aliases=baguette-s3
target=esp32s3
module=ESP32-S3-MINI-1-N8
homepage=https://thepihut.com/products/baguette-s3-esp32-s3-prototyping-board
documentation=https://thepihut.com/blogs/raspberry-pi-tutorials/baguette-s3-user-guide

[build]
flash_size=8MiB
psram_size=none
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[bus.i2c.default]
controller=0
sda=SDA
scl=SCL
frequency=400000

[bus.spi.default]
controller=0
miso=MISO
mosi=MOSI
clock=CLK
chip_select=CS

[bus.uart.default]
controller=0
tx=TX
rx=RX
baud=115200

[resource.rgb_led]
type=ws2812c
pin=LED
count=1
order=grb

[resource.microsd]
type=microsd
interface=sdmmc_1bit
controller=0
clock=SD_CLK
command=SD_CMD
data0=SD_DATA0
data3=SD_DATA3

[resource.qwiic]
type=i2c_connector
bus=bus.i2c.default
voltage=3.3V

[resource.boot_button]
type=button
pin=BOOT
active=low

[constraint.native_usb]
pins=USB_DM,USB_DP
status=occupied
reason=Used by the native USB Serial/JTAG connection

[constraint.microsd]
pins=SD_CLK,SD_CMD,SD_DATA0,SD_DATA3
status=occupied
reason=Wired to the onboard MicroSD socket
