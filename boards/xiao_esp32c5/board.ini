# Sources:
# https://wiki.seeedstudio.com/xiao_esp32c5_getting_started/
# https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c5/schematic-checklist.html
# Chip and flash verified on a connected XIAO ESP32-C5.
format=1

[board]
name=Seeed Studio XIAO ESP32-C5
vendor=Seeed Studio
kind=board
aliases=xiao-esp32c5,xiao-c5
target=esp32c5
documentation=https://wiki.seeedstudio.com/xiao_esp32c5_getting_started/

[build]
flash_size=8MiB
psram_size=8MiB
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[bus.i2c.default]
controller=0
sda=SDA
scl=SCL
frequency=400000

[bus.spi.default]
controller=0
miso=MISO
mosi=MOSI
clock=SCK

[bus.uart.default]
controller=0
tx=TX
rx=RX
baud=115200

[resource.user_led]
type=led
pin=USER_LED
active=low

[resource.boot_button]
type=button
pin=BOOT
active=low

[resource.battery_sense]
type=adc
pin=ADC_BAT

[resource.battery_sense_enable]
type=enable
pin=ADC_BAT_EN
active=high

[constraint.strapping]
pins=D2,D3,MTMS,MTDI,ADC_BAT_EN,USER_LED,BOOT
status=caution
reason=GPIO25, GPIO7, GPIO2, GPIO3, GPIO26, GPIO27 and GPIO28 are sampled as strapping pins during reset

[constraint.native_usb]
pins=USB_DM,USB_DP
status=occupied
reason=GPIO13 and GPIO14 are used by the native USB Serial/JTAG interface

[constraint.battery_sense]
pins=ADC_BAT,ADC_BAT_EN
status=shared
reason=Set GPIO26 high to enable the battery voltage divider on GPIO6, then disable it when not measuring

[constraint.jtag]
pins=MTMS,MTDI,MTCK,MTDO
status=caution
reason=Shared with the optional external JTAG interface on the underside pads
