# Sources:
# https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32s31/esp32-s31-function-coreboard-1/user_guide.html
# https://dl.espressif.com/schematics/esp32-s31-function-coreboard-1-schematics.pdf
# Chip revision v0.0 and 16 MB flash verified on a connected board.
format=1

[board]
name=Espressif ESP32-S31-Function-CoreBoard-1
vendor=Espressif
kind=board
aliases=esp32-s31-function-coreboard-1,s31-function-coreboard-1,function-coreboard-1
target=esp32s31
module=ESP32-S31-WROOM-3
documentation=https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32s31/esp32-s31-function-coreboard-1/user_guide.html

[build]
flash_size=16MiB
psram_size=16MiB
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=uart

[bus.i2c.codec]
controller=0
sda=CODEC_SDA
scl=CODEC_SCL
frequency=400000

[bus.uart.default]
controller=0
tx=UART_TX
rx=UART_RX
baud=115200

[resource.ethernet]
type=yt8531dc
interface=rgmii

[resource.audio_codec]
type=es8311
bus=bus.i2c.codec

[resource.microphone]
type=electret_microphone

[resource.speaker_output]
type=ns4150b_3w_4ohm
pin=PA_CTRL

[resource.rgb_led]
type=ws2812
pin=RGB_LED
count=1
order=grb

[resource.usb_host]
type=usb2_high_speed_host_500ma
interface=type_a
voltage=5V

[resource.usb_serial_jtag]
type=usb_serial_jtag
interface=type_c

[resource.usb_uart_bridge]
type=usb_uart_bridge
bus=bus.uart.default
interface=type_c

[constraint.strapping]
pins=GPIO36,GPIO37,RGB_LED,BOOT
status=caution
reason=GPIO36, GPIO37, GPIO60 and GPIO61 are sampled as strapping pins during reset

[constraint.ethernet]
pins=ETH_INTN,PHY_MDIO,PHY_MDC,ETH_PHY_RST,ETH_TXD0,ETH_TXD1,ETH_TXD2,ETH_TXD3,ETH_TX_CTL,ETH_TX_CLK,ETH_RXD0,ETH_RXD1,ETH_RXD2,ETH_RXD3,ETH_RX_CTL,ETH_RX_CLK
status=occupied
reason=Connected to the onboard YT8531DC Gigabit Ethernet PHY over RGMII

[constraint.audio]
pins=CODEC_SCL,CODEC_SDA,I2S_MCLK,I2S_SCLK,I2S_LRCLK,I2S_SDOUT,I2S_SDIN,PA_CTRL
status=occupied
reason=Connected to the onboard ES8311 codec, microphone and NS4150B speaker amplifier

[constraint.rgb_led]
pins=RGB_LED
status=occupied
reason=Connected to the onboard addressable RGB LED

[constraint.boot]
pins=BOOT
status=occupied
reason=Connected to the Boot button and automatic download circuit

[constraint.uart_bridge]
pins=UART_TX,UART_RX
status=occupied
reason=Connected to the onboard USB-to-UART bridge used for flashing and the default console
