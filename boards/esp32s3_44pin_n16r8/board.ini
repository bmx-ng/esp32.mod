# Source: ESP32 S3 Development Board N8R2/N16R8 CH343P Serial with USB Micro Type-C manual
format=1

[board]
name=ESP32-S3 44-pin N16R8 Development Board
kind=board
aliases=esp32-s3-44pin-n16r8,s3-44pin-n16r8
target=esp32s3
module=ESP32-S3-WROOM-1-N16R8

[build]
flash_size=16MiB
psram_size=8MiB
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=uart

[bus.uart.default]
controller=0
tx=TX
rx=RX
baud=115200

[resource.rgb_led]
type=ws2812
pin=RGB_LED
count=1
order=grb

[resource.boot_button]
type=button
pin=BOOT
active=low

[constraint.strapping]
pins=BOOT,IO3,IO45,IO46
status=caution
reason=GPIO0, GPIO3, GPIO45 and GPIO46 are sampled as strapping pins during reset

[constraint.native_usb]
pins=USB_DM,USB_DP
status=caution
reason=Wired to the separate native USB and USB-OTG Type-C connector
