# Sources:
# https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32s31/esp32-s31-korvo-1/user_guide.html
# https://documentation.espressif.com/esp32-s31_datasheet_en.pdf
# Chip revision v0.0 and 16 MB flash verified on a connected V1.1 board.
format=1

[board]
name=Espressif ESP32-S31-Korvo-1 V1.1
vendor=Espressif
kind=board
aliases=esp32-s31-korvo-1,s31-korvo-1,korvo-s31
target=esp32s31
module=ESP32-S31-WROOM-3
documentation=https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32s31/esp32-s31-korvo-1/user_guide.html

[build]
flash_size=16MiB
psram_size=16MiB
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=uart

[bus.i2c.codec]
controller=0
sda=CODEC_SDA
scl=CODEC_SCL
frequency=400000

[bus.uart.default]
controller=0
tx=UART_TX
rx=UART_RX
baud=115200

[resource.audio_codec]
type=es8389
bus=bus.i2c.codec

[resource.rgb_led]
type=ws2812
pin=RGB_LED
count=1
order=grb

[resource.function_buttons]
type=adc_buttons
pin=ADC_BUTTONS

[resource.microsd]
type=microsd
interface=sdmmc_1bit
controller=0
clock=SD_CLK
command=SD_CMD
data0=SD_DATA0
data1=SD_DATA1
data2=SD_DATA2
data3=SD_DATA3

[resource.sd_power]
type=enable
pin=SD_CTRL

[resource.usb_uart_bridge]
type=usb_uart_bridge
bus=bus.uart.default

[constraint.strapping]
pins=LCD_R7,RGB_LED,LCD_MOSI,LCD_SCK
status=caution
reason=GPIO36, GPIO37, GPIO60 and GPIO61 are sampled as strapping pins during reset

[constraint.audio]
pins=CODEC_SDA,CODEC_SCL,I2S_MCLK,I2S_SCLK,I2S_LRCLK,I2S_SDOUT,I2S_SDIN,PA_CTRL
status=occupied
reason=Connected to the onboard ES8389 codec and speaker amplifier control

[constraint.microsd]
pins=SD_DATA0,SD_DATA1,SD_DATA2,SD_DATA3,SD_CLK,SD_CMD,SD_CTRL
status=occupied
reason=Connected to the onboard microSD slot; GPIO20 through GPIO25 are shared with the unpopulated SPI NAND option

[constraint.lcd]
pins=LCD_B3,LCD_B4,LCD_B5,LCD_B6,LCD_B7,LCD_G2,LCD_G3,LCD_G4,LCD_G5,LCD_G6,LCD_G7,LCD_R3,LCD_R4,LCD_R5,LCD_R6,LCD_R7,LCD_CS,LCD_PCLK,LCD_DE,LCD_HSYNC,LCD_VSYNC,LCD_MOSI,LCD_SCK
status=occupied
reason=Connected to the RGB LCD subboard interface

[constraint.camera]
pins=CAM_D0,CAM_D1,CAM_D2,CAM_D3,CAM_D4,CAM_D5,CAM_D6,CAM_D7,CAM_PCLK,CAM_XCLK,CAM_VSYNC,CAM_HSYNC,LCD_CS
status=occupied
reason=Connected to the onboard DVP camera; camera GM_FK shares GPIO38 with LCD chip select

[constraint.uart_bridge]
pins=UART_TX,UART_RX
status=occupied
reason=Connected to the onboard USB-to-UART bridge used for flashing and the default console
