# Sources:
# https://docs.m5stack.com/en/core/Stamp-P4
# https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32p4/schematic-checklist-esp32p4.html
# Chip revision v1.3 and flash verified on a connected M5Stack Stamp-P4.
format=1

[board]
name=M5Stack Stamp-P4
vendor=M5Stack
kind=board
aliases=stamp-p4,m5stamp-p4
target=esp32p4
module=ESP32-P4NRW32
documentation=https://docs.m5stack.com/en/core/Stamp-P4

[build]
flash_size=16MiB
psram_size=32MiB
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[constraint.strapping]
pins=G34,G35,G36,G37,G38
status=caution
reason=GPIO34 through GPIO38 are sampled as strapping pins during reset; GPIO35 selects download mode

[constraint.soc_revision]
status=caution
reason=This profile selects ESP-IDF support for P4 revisions 0.x and 1.x; P4 revision 3.x requires a different build configuration

[constraint.native_usb]
pins=G24,G25
status=occupied
reason=GPIO24 and GPIO25 are used by the native USB Serial/JTAG interface

[constraint.wifi]
status=unavailable
reason=ESP32-P4 has no onboard Wi-Fi radio; wireless networking requires a separate companion module

[constraint.ble]
status=unavailable
reason=ESP32-P4 has no onboard Bluetooth LE radio; wireless features require a separate companion module
