# Source: https://wiki.seeedstudio.com/xiao_esp32s3_getting_started/
# Flash and embedded PSRAM verified on a connected XIAO ESP32-S3 Plus.
format=1

[board]
name=Seeed Studio XIAO ESP32-S3 Plus
vendor=Seeed Studio
kind=board
aliases=xiao-esp32s3-plus,xiao-s3-plus
target=esp32s3
module=ESP32-S3R8
homepage=https://www.seeedstudio.com/Seeed-Studio-XIAO-ESP32S3-Plus-p-6361.html
documentation=https://wiki.seeedstudio.com/xiao_esp32s3_getting_started/

[build]
flash_size=16MiB
psram_size=8MiB
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[bus.i2c.default]
controller=0
sda=SDA
scl=SCL
frequency=400000

[bus.spi.default]
controller=0
miso=MISO
mosi=MOSI
clock=SCK

[bus.uart.default]
controller=0
tx=TX
rx=RX
baud=115200

[resource.user_led]
type=led
pin=USER_LED
active=low

[resource.boot_button]
type=button
pin=BOOT
active=low

[constraint.strapping]
pins=BOOT,D2
status=caution
reason=GPIO0 and GPIO3 are sampled as strapping pins during reset

[constraint.native_usb]
pins=USB_DM,USB_DP
status=occupied
reason=Used by the native USB Serial/JTAG connection

[constraint.battery_sense]
pins=D16,ADC_BAT
status=shared
reason=D16 and the battery-sense signal both use GPIO10
