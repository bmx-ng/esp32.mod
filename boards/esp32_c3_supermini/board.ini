# Sources:
# https://nuttx.apache.org/docs/latest/platforms/risc-v/esp32c3/boards/esp32c3-supermini/index.html
# https://www.espboards.dev/esp32/esp32-c3-super-mini/
# https://docs.espressif.com/projects/esp-idf/en/latest/esp32c3/api-reference/peripherals/gpio.html
format=1

[board]
name=ESP32-C3 SuperMini
kind=board
aliases=esp32-c3-supermini,c3-supermini,esp32c3_supermini,tenstar_robot_c3_supermini,tenstar-robot-c3-supermini
target=esp32c3
documentation=https://nuttx.apache.org/docs/latest/platforms/risc-v/esp32c3/boards/esp32c3-supermini/index.html

[build]
flash_size=4MiB
psram_size=none
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[bus.i2c.default]
controller=0
sda=SDA
scl=SCL
frequency=100000

[bus.spi.default]
controller=0
miso=MISO
mosi=MOSI
clock=SCK
chip_select=CS

[bus.uart.default]
controller=0
tx=TX
rx=RX
baud=115200

[resource.status_led]
type=led
pin=LED
active=low

[resource.boot_button]
type=button
pin=BOOT
active=low

[constraint.led_i2c]
pins=LED,SDA
status=caution
reason=The GPIO8 status LED shares the published I2C SDA pin; GPIO8 is also a boot strapping pin

[constraint.strapping]
pins=IO2,LED,BOOT
status=caution
reason=GPIO2, GPIO8 and GPIO9 are sampled as strapping pins during reset; GPIO9 is also the published default I2C SCL pin

[constraint.native_usb]
pins=USB_DM,USB_DP
status=occupied
reason=GPIO18 and GPIO19 are wired to the native USB Serial/JTAG connector

[constraint.jtag]
pins=SCK,MISO,MOSI,CS
status=caution
reason=GPIO4 through GPIO7 also carry external JTAG signals
