# Sources:
# https://www.espboards.dev/esp32/esp32-h2-super-mini/
# https://docs.zephyrproject.org/latest/boards/others/esp32h2_supermini/doc/index.html
# https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32h2/schematic-checklist.html
format=1

[board]
name=ESP32-H2 SuperMini
kind=board
aliases=esp32-h2-supermini,h2-supermini,tenstar_h2_supermini,tenstar-h2-supermini
target=esp32h2
module=ESP32-H2FH4
documentation=https://www.espboards.dev/esp32/esp32-h2-super-mini/

[build]
flash_size=4MiB
psram_size=none
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[resource.rgb_led]
type=ws2812
pin=RGB_LED
count=1
order=grb

[resource.status_led]
type=led
pin=LED

[resource.boot_button]
type=button
pin=BOOT
active=low

[constraint.strapping]
pins=RGB_LED,BOOT,IO25
status=caution
reason=GPIO8, GPIO9 and GPIO25 are sampled as strapping pins during reset

[constraint.native_usb]
pins=USB_DM,USB_DP
status=occupied
reason=Used by the native USB Serial/JTAG connection

[constraint.jtag]
pins=IO2,IO3,IO4,IO5
status=caution
reason=Shared with the default external JTAG interface

[constraint.uart0]
pins=IO23
status=caution
reason=GPIO23 is the default UART0 receive pin; its transmit pin GPIO24 is not exposed

[constraint.wifi]
status=unavailable
reason=ESP32-H2 has Bluetooth LE and IEEE 802.15.4 radios but no Wi-Fi radio
