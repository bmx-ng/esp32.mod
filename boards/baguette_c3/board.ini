# Sources:
# https://thepihut.com/products/baguette-c3-esp32-c3-prototyping-board
# https://thepihut.com/blogs/raspberry-pi-tutorials/baguette-c3-user-guide
format=1

[board]
name=Baguette C3
vendor=The Pi Hut
kind=board
aliases=baguette-c3
target=esp32c3
module=ESP32-C3-MINI-1-H4
homepage=https://thepihut.com/products/baguette-c3-esp32-c3-prototyping-board
documentation=https://thepihut.com/blogs/raspberry-pi-tutorials/baguette-c3-user-guide

[build]
flash_size=4MiB
psram_size=none
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[bus.i2c.default]
controller=0
sda=SDA
scl=SCL
frequency=400000

[bus.spi.default]
controller=0
miso=MISO
mosi=MOSI
clock=CLK
chip_select=CS

[bus.uart.default]
controller=0
tx=TX
rx=RX
baud=115200

[resource.rgb_led]
type=ws2812c
pin=LED
count=1
order=grb

[resource.qwiic]
type=i2c_connector
bus=bus.i2c.default
voltage=3.3V

[resource.boot_button]
type=button
pin=BOOT
active=low

[constraint.strapping]
pins=MISO,LED,BOOT
status=caution
reason=GPIO2, GPIO8 and GPIO9 affect boot strapping; see the board guide

[constraint.default_bus_conflict]
pins=SCL,CLK
status=caution
reason=The documented default I2C clock and SPI clock both use GPIO6

[constraint.native_usb]
pins=USB_DM,USB_DP
status=occupied
reason=Used by the native USB Serial/JTAG connection
