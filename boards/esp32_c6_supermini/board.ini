# Sources:
# https://mischianti.org/esp32-c6-supermini-high-resolution-pinout-datasheet-schema-and-specs/
# https://docs.espressif.com/projects/esp-idf/en/stable/esp32c6/api-reference/peripherals/gpio.html
format=1

[board]
name=ESP32-C6 SuperMini
kind=board
aliases=c6-supermini,tenstar_c6_supermini,tenstar-c6-supermini
target=esp32c6
module=ESP32-C6FH4
documentation=https://mischianti.org/esp32-c6-supermini-high-resolution-pinout-datasheet-schema-and-specs/

[build]
flash_size=4MiB
psram_size=none
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[bus.i2c.default]
controller=0
sda=IO20
scl=IO19
frequency=400000

[bus.uart.default]
controller=0
tx=TX
rx=RX
baud=115200

[resource.rgb_led]
type=ws2812
pin=RGB_LED
count=1
order=grb

[resource.status_led]
type=led
pin=LED
active=high

[resource.boot_button]
type=button
pin=BOOT
active=low

[constraint.strapping]
pins=IO4,IO5,RGB_LED,BOOT,LED
status=caution
reason=GPIO4, GPIO5, GPIO8, GPIO9 and GPIO15 are sampled as strapping pins during reset

[constraint.native_usb]
pins=USB_DM,USB_DP
status=occupied
reason=Used by the native USB Serial/JTAG connection

[constraint.jtag]
pins=IO4,IO5,IO6,IO7
status=caution
reason=Shared with the external JTAG interface
