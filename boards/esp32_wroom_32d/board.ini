# Sources:
# https://documentation.espressif.com/esp32-wroom-32d_esp32-wroom-32u_datasheet_en.html
# ESP32-D0WD-V3 revision 3.1 and 4 MB flash verified on a connected module.
format=1

[board]
name=Espressif ESP32-WROOM-32D
vendor=Espressif
kind=board
aliases=esp32-wroom-32d,esp-wroom-32d,wroom-32d,esp32-32d
target=esp32
module=ESP32-WROOM-32D
documentation=https://documentation.espressif.com/esp32-wroom-32d_esp32-wroom-32u_datasheet_en.html

[build]
flash_size=4MiB
psram_size=none
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=uart

[bus.uart.default]
controller=0
tx=TX0
rx=RX0
baud=115200

[constraint.strapping]
pins=IO0,IO2,IO5,IO12,IO15
status=caution
reason=GPIO0, GPIO2, GPIO5, GPIO12 and GPIO15 are sampled as strapping pins during reset

[constraint.input_only]
pins=IO34,IO35,SENSOR_VP,SENSOR_VN
status=caution
reason=GPIO34 through GPIO39 are input-only and do not provide software-controlled pull-up or pull-down resistors

[constraint.spi_flash]
pins=FLASH_CLK,FLASH_SD0,FLASH_SD1,FLASH_SD2,FLASH_SD3,FLASH_CMD
status=occupied
reason=GPIO6 through GPIO11 are connected to the module's internal SPI flash and are not available to applications
