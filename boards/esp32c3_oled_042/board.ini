# Sources:
# https://docs.zephyrproject.org/latest/boards/01space/esp32c3_042_oled/doc/index.html
# https://github.com/01Space/ESP32-C3-0.42LCD
# OLED address, pins, flash, and native USB console verified on connected hardware.
format=1

[board]
name=ESP32-C3 0.42-inch OLED
kind=board
aliases=esp32-c3-oled-042,esp32c3-042-oled,c3-oled-042,01space-esp32c3-oled
target=esp32c3
module=ESP32-C3FH4
documentation=https://docs.zephyrproject.org/latest/boards/01space/esp32c3_042_oled/doc/index.html

[build]
flash_size=4MiB
psram_size=none
sdkconfig_defaults=sdkconfig.defaults
partitions=partitions.csv

[console]
transport=usb_serial_jtag

[bus.i2c.default]
controller=0
sda=OLED_SDA
scl=OLED_SCL
frequency=400000

[bus.uart.default]
controller=0
tx=TX
rx=RX
baud=115200

[resource.display]
type=display
driver=ssd1306
bus=bus.i2c.default
address=0x3c
width=72
height=40
pixel_format=mono1
x_offset=28
y_offset=0
rotation=0

[resource.boot_button]
type=button
pin=BOOT
active=low

[constraint.display_i2c]
pins=OLED_SDA,OLED_SCL
status=shared
reason=GPIO5 and GPIO6 are connected to the onboard OLED and may be shared with other I2C devices

[constraint.strapping]
pins=IO2,IO8,BOOT
status=caution
reason=GPIO2, GPIO8 and GPIO9 are sampled as strapping pins during reset

[constraint.native_usb]
pins=USB_DM,USB_DP
status=occupied
reason=GPIO18 and GPIO19 are wired to the native USB Serial/JTAG connector
